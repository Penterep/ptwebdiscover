name: Release Python Package

# Manual trigger workflow
on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest  # virtual machine where the workflow runs

    steps:
      # Checkout the repository
      - uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # Install build tools
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # Build the package
      - name: Build the package
        run: python -m build

      # Upload to PyPI
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}  # usually "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}  # API token from PyPI
        run: twine upload dist/*
